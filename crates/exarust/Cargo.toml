[package]
name = "exarust"
description = "Exarust: an open-source Exanima runtime on Bevy"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Frame profiling through Bevy's tracing spans (every system, schedule and
# render step). `trace-chrome` writes a trace-*.json for Perfetto
# (ui.perfetto.dev); `trace-tracy` streams to the Tracy profiler. Both cost
# frame time, so neither is in a default build. See docs/PERFORMANCE.md.
trace-chrome = ["bevy/trace_chrome"]
trace-tracy = ["bevy/trace_tracy"]

[dependencies]
bevy.workspace = true
exa_render.workspace = true
exa_ai.workspace = true
exa_anim.workspace = true
exa_combat.workspace = true
exa_assets.workspace = true
exa_audio.workspace = true
exa_character.workspace = true
exa_formats.workspace = true
exa_game.workspace = true
exa_items.workspace = true
exa_physics.workspace = true
exa_ui.workspace = true
exa_world.workspace = true

[lints]
workspace = true
